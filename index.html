<!DOCTYPE html>
<html lang="nl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#68002C">
<title>Leeshoek – boekentracker</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{color-scheme:dark;--bg:#68002C;--card:#520023;--ink:#FFF8D5;--mut:#E098AC;--acc:#E098AC;--on:#441910;--acc2:#A6C9DD;--line:#8c2a52;--plank:#441910;--kast:#3b0019;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="forest"]{--bg:#243326;--card:#1B271D;--ink:#FBF4E4;--mut:#C9B28B;--acc:#D8935B;--on:#23160C;--acc2:#95C2A2;--line:#3B513E;--plank:#4A311E;--kast:#151F17}
:root[data-theme="night"]{--bg:#121726;--card:#1B2236;--ink:#F2F5FF;--mut:#9BA8C7;--acc:#9AB3E8;--on:#0E1525;--acc2:#E3A4BD;--line:#2E3856;--plank:#262C3D;--kast:#0B0F1A}

*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Bricolage Grotesque",system-ui,sans-serif;transition:background .25s, color .25s}
#wrap{display:flex;align-items:flex-start;max-width:1360px;margin:auto}
#col{flex:1;min-width:0;padding-top:12px;}
header{padding:16px 20px;max-width:1120px;margin:auto}

/* Topbar met Gebruikersprofiel knop rechtsboven */
#topbar{max-width:1120px;margin:0 auto;padding:4px 20px 0;display:flex;justify-content:flex-end;align-items:center;gap:10px}
.sync-pill{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--mut);opacity:.85;display:inline-flex;align-items:center;gap:6px}
.sync-pill i{width:7px;height:7px;border-radius:50%;display:inline-block;background:#38D399}
.sync-pill.syncing i{background:#F5B041;animation:pulse 1s infinite}
.sync-pill.error i{background:#FF5C5C}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.profile-btn{display:inline-flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 14px 5px 6px;color:var(--ink);cursor:pointer;font-weight:600;font-size:15px;box-shadow:0 4px 16px rgba(0,0,0,.25);transition:background .15s, border-color .15s, transform .15s}
.profile-btn:hover{border-color:var(--acc);transform:translateY(-1px)}
.pb-av-wrap{position:relative;width:34px;height:34px;flex:none}
.pb-av{width:34px;height:34px;border-radius:50%;border:2px solid var(--acc);background:var(--kast);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;overflow:hidden;background-size:cover;background-position:center}
.pb-dot{position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;background:#38D399;border:2px solid var(--card)}
.pb-dot.syncing{background:#F5B041}
.pb-dot.error{background:#FF5C5C}
.pb-chev{width:15px;height:15px;stroke:var(--mut);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

#side{position:sticky;top:12px;margin:16px 0 0 16px;width:180px;flex:none;background:var(--card);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:4px;transition:width .2s}
#side button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:8px 10px;border-radius:10px;cursor:pointer;text-align:left;white-space:nowrap;overflow:hidden;width:100%;color:#FFFFFF}
#side button:hover{background:var(--bg)}
#side nav{display:flex;flex-direction:column;gap:4px}
#side nav button.on{background:var(--acc);color:var(--on)}
#side nav button.on svg{stroke:var(--on)}
#side .ic{width:20px;text-align:center;flex:none;display:inline-flex;align-items:center;justify-content:center}
#side .ic svg{width:20px;height:20px;stroke:#FFFFFF;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#side.min{width:52px}
#side.min .tx{display:none}
#tog .ic{transition:transform .2s}
#side:not(.min) #tog .ic{transform:rotate(180deg)}
@media(max-width:600px){#side{position:fixed;left:8px;top:8px;margin:0;z-index:5;box-shadow:0 4px 20px rgba(0,0,0,.25)}#col{padding-left:60px}}
h1{font-size:28px;font-weight:800;margin:0;letter-spacing:-.5px}
button,select,input,textarea{font:inherit;color:inherit}
main{max-width:1120px;margin:auto;padding:0 20px 60px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 20px}
.bar input,.bar select{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.btn{background:var(--acc);color:var(--on);border:0;border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[role="button"]:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}

/* Boekenkast Styling */
.bookcase {
  background-color: var(--kast);
  background-image: 
    linear-gradient(90deg, rgba(0,0,0,0.3) 0%, transparent 5%, transparent 95%, rgba(0,0,0,0.3) 100%),
    repeating-linear-gradient(0deg, transparent, transparent 150px, rgba(0,0,0,0.08) 150px, rgba(0,0,0,0.08) 152px);
  border: 12px solid var(--kast);
  border-radius: 8px;
  box-shadow: 0 16px 40px rgba(0,0,0,0.25), inset 0 0 50px rgba(0,0,0,0.4);
  padding: 16px 12px 0 12px;
  margin-bottom: 32px;
}

.shelf{display:flex;align-items:flex-end;gap:3px;flex-wrap:nowrap;overflow-x:auto;padding:18px 12px 0;min-height:208px;border-bottom:16px solid var(--plank);margin-bottom:24px;position:relative;box-shadow: inset 0 -10px 10px -5px rgba(0,0,0,0.3);transition:background .15s, outline .15s}
.shelf.is-empty{min-height:84px;align-items:center;justify-content:center;padding:12px}
.shelf-empty{font-size:13px;color:var(--mut);opacity:.65;pointer-events:none;font-family:ui-monospace,Menlo,monospace}
.shelf::after {
  content: '';
  position: absolute;
  bottom: -16px;
  left: 0;
  right: 0;
  height: 4px;
  background: rgba(255,255,255,0.15);
}

/* 3D Boekenruggen (Spines) */
.spine {
  flex: none; border: 0; border-radius: 3px 3px 0 0; cursor: grab; color: #fff;
  writing-mode: vertical-rl; font-size: 13px; font-weight: 600; width: 38px;
  overflow: hidden; transition: transform .15s, box-shadow .15s, opacity .15s;
  box-shadow: inset 4px 0 8px rgba(255,255,255,0.25), inset -8px 0 12px rgba(0,0,0,0.4), -2px 0 5px rgba(0,0,0,0.4);
  text-shadow: 0 1px 2px rgba(0,0,0,0.4);
  user-select: none; -webkit-user-select: none;
}
.spine:active { cursor: grabbing; }
.spine:not(.img) {
  display: flex; justify-content: space-between; align-items: center; padding: 12px 4px;
}
.spine:hover, .spine:focus-visible { transform: translateY(-14px); }
.spine.img {
  background-size: cover; background-position: center; text-indent: -999px; color: transparent;
  display: block; padding: 0;
}
.sp-title {
  white-space: normal; line-height: 1.15; overflow: hidden; width: 100%; text-align: left;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; flex-shrink: 1;
}
.sp-author {
  white-space: normal; line-height: 1.15; font-weight: 400; font-size: 11px; opacity: 0.85; overflow: hidden;
  width: 100%; text-align: right; margin-top: 8px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; flex-shrink: 0;
}

/* Geselecteerd boek op plank */
.spine.selected, .cover.selected, .flat-book.selected {
  outline: 2px solid var(--acc);
  outline-offset: 1px;
  z-index: 2;
}

/* Cover / Face out op plank */
.cover{flex:none;width:105px;height:158px;border:0;border-radius:3px 6px 6px 3px;cursor:grab;color:#fff;padding:10px 8px;text-align:left;font-weight:600;font-size:13px;line-height:1.2;display:flex;flex-direction:column;justify-content:space-between;box-shadow:inset 6px 0 rgba(0,0,0,.25), 0 4px 10px rgba(0,0,0,.4);transition:transform .15s, box-shadow .15s, opacity .15s;text-shadow:0 1px 3px rgba(0,0,0,.6);user-select:none;-webkit-user-select:none}
.cover:active{cursor:grabbing}
.cover small{font-weight:400;opacity:.85}
.cover:hover,.cover:focus-visible{transform:translateY(-14px)}

/* Platliggende boeken (Lay it flat & stapelen) */
.flat-stack {
  display: flex;
  flex-direction: column-reverse;
  align-items: center;
  flex: none;
  margin: 0 4px;
  gap: 1px;
}
.flat-book {
  flex: none;
  border: 0;
  border-radius: 3px;
  cursor: grab;
  color: #fff;
  font-size: 12px;
  font-weight: 600;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 10px;
  gap: 8px;
  transition: transform .15s, box-shadow .15s, opacity .15s;
  box-shadow: inset 0 4px 6px rgba(255,255,255,0.22), inset 0 -6px 8px rgba(0,0,0,0.4), 0 2px 5px rgba(0,0,0,0.45);
  text-shadow: 0 1px 2px rgba(0,0,0,0.5);
  white-space: nowrap;
  user-select: none; -webkit-user-select: none;
}
.flat-book:active { cursor: grabbing; }
.flat-book:hover, .flat-book:focus-visible { transform: translateX(4px); }
.flat-book .fb-title { overflow: hidden; text-overflow: ellipsis; }
.flat-book .fb-author { font-weight: 400; font-size: 10px; opacity: 0.85; flex-shrink: 0; }
.flat-book.img {
  background-size: cover;
  background-position: center;
  color: transparent;
  text-shadow: none;
}

/* Drag & Drop Visuele Feedback */
.dragging { opacity: 0.35 !important; transform: scale(0.95) !important; }
body.is-dragging .spine:hover,
body.is-dragging .cover:hover,
body.is-dragging .flat-book:hover { transform: none; }

.drop-before { box-shadow: -5px 0 0 0 var(--acc2), 0 0 14px rgba(166,201,221,0.55) !important; z-index: 4; }
.drop-after  { box-shadow:  5px 0 0 0 var(--acc2), 0 0 14px rgba(166,201,221,0.55) !important; z-index: 4; }
.drop-top    { box-shadow: 0 -5px 0 0 var(--acc2), 0 0 14px rgba(166,201,221,0.55) !important; z-index: 4; }
.drop-bottom { box-shadow: 0  5px 0 0 var(--acc2), 0 0 14px rgba(166,201,221,0.55) !important; z-index: 4; }

.shelf.drop-over {
  background: rgba(166, 201, 221, 0.14);
  outline: 2px dashed var(--acc2);
  outline-offset: -4px;
}
body.is-dragging [data-drop-status] {
  border-style: dashed !important;
  border-color: var(--acc2) !important;
  transition: transform .15s, background .15s, color .15s;
}
[data-drop-status].drop-over {
  background: var(--acc2) !important;
  color: var(--on) !important;
  border-style: solid !important;
  border-color: var(--acc2) !important;
  transform: scale(1.06);
}
[data-drop-status].drop-over .mono { color: var(--on) !important; }

.drag-hint {
  font-family: ui-monospace, Menlo, monospace;
  font-size: 12px;
  color: var(--mut);
  opacity: 0.85;
  margin: -8px 0 14px;
}

/* Planken + Spotlight split layout */
.shelf-split {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 330px;
  gap: 20px;
  align-items: start;
}
@media(max-width: 960px) {
  .shelf-split { grid-template-columns: 1fr; }
}

/* Spotlight Paneel */
.spotlight-panel {
  position: sticky;
  top: 16px;
  background: #231419;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 20px;
  padding: 20px 20px 26px;
  text-align: center;
  overflow: hidden;
  box-shadow: 0 20px 50px rgba(0,0,0,0.45);
}
.spot-close {
  position: absolute;
  top: 14px;
  right: 14px;
  width: 34px;
  height: 34px;
  border-radius: 10px;
  border: 0;
  background: rgba(255,255,255,0.1);
  color: #fff;
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 5;
}
.spot-close:hover { background: rgba(255,255,255,0.2); }

.spot-stage {
  position: relative;
  padding-top: 42px;
  padding-bottom: 14px;
  margin: -20px -20px 16px;
  background: linear-gradient(180deg, #1b0f13 0%, #231419 100%);
  border-bottom: 8px solid #352019;
  overflow: hidden;
}
.spot-lamp {
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  width: 56px;
  height: 26px;
  background: linear-gradient(180deg, #f3e9dc 0%, #d8c8b8 100%);
  border-radius: 28px 28px 6px 6px;
  box-shadow: 0 6px 18px rgba(255, 232, 180, 0.45);
  z-index: 3;
}
.spot-lamp::before {
  content: '';
  position: absolute;
  top: -10px;
  left: 50%;
  transform: translateX(-50%);
  width: 10px;
  height: 12px;
  background: #8c624d;
  border-radius: 4px 4px 0 0;
}
.spot-beam {
  position: absolute;
  top: 32px;
  left: 50%;
  transform: translateX(-50%);
  width: 260px;
  height: 250px;
  background: linear-gradient(180deg, rgba(255, 235, 195, 0.28) 0%, rgba(255, 235, 195, 0.08) 65%, rgba(255, 235, 195, 0) 100%);
  clip-path: polygon(38% 0%, 62% 0%, 100% 100%, 0% 100%);
  pointer-events: none;
  z-index: 1;
}
.spot-cover {
  position: relative;
  z-index: 2;
  width: 142px;
  height: 214px;
  margin: 0 auto;
  border-radius: 4px 8px 8px 4px;
  box-shadow: 0 14px 30px rgba(0,0,0,0.65), inset 5px 0 rgba(0,0,0,0.22);
  background-size: cover;
  background-position: center;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 14px 12px;
  text-align: left;
  color: #fff;
  font-weight: 700;
  font-size: 16px;
  text-shadow: 0 1px 4px rgba(0,0,0,0.5);
}
.spot-kicker {
  font-family: ui-monospace, Menlo, monospace;
  font-size: 12px;
  letter-spacing: 0.08em;
  color: var(--mut);
  margin: 0 0 6px;
}
.spot-title {
  margin: 0 0 4px;
  font-size: 22px;
  font-weight: 800;
  line-height: 1.2;
  color: #fff;
}
.spot-author {
  margin: 0 0 8px;
  font-size: 15px;
  color: rgba(255,248,213,0.75);
}
.spot-stars {
  font-size: 15px;
  letter-spacing: 3px;
  margin-bottom: 18px;
  color: rgba(255,255,255,0.25);
}
.spot-stars span { color: var(--acc); }

.spot-actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
}
.spot-btn {
  border-radius: 999px;
  padding: 9px 16px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid rgba(255,255,255,0.22);
  background: transparent;
  color: #fff;
  transition: background .15s, border-color .15s, color .15s;
}
.spot-btn:hover { background: rgba(255,255,255,0.08); }
.spot-btn.primary {
  background: var(--acc);
  color: var(--on);
  border-color: var(--acc);
}
.spot-btn.primary:hover { filter: brightness(1.06); }
.spot-btn.active {
  background: rgba(224, 152, 172, 0.22);
  border-color: var(--acc);
  color: var(--acc);
}

/* Spine Size Modal */
dialog.spine-dlg {
  width: min(560px, 94vw);
  background: #FFF9F2;
  color: #2B171D;
  border-radius: 22px;
  padding: 22px 24px 24px;
  overflow: visible;
}
.sp-dlg-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
}
.sp-dlg-kicker {
  font-family: ui-monospace, Menlo, monospace;
  font-size: 13px;
  color: #8c2a52;
  margin: 0;
}
.sp-dlg-close {
  width: 32px;
  height: 32px;
  border-radius: 10px;
  border: 0;
  background: rgba(43, 23, 29, 0.12);
  color: #2B171D;
  cursor: pointer;
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.sp-dlg-close:hover { background: rgba(43, 23, 29, 0.22); }
.sp-preview {
  background: #1B0F14;
  border-radius: 12px;
  border-bottom: 12px solid #2C1814;
  height: 225px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 3px;
  padding: 16px 12px 0;
  margin-bottom: 22px;
  overflow: hidden;
}
.sp-preview .spine { cursor: default; }
.sp-preview .spine:hover { transform: none; }
.sp-preview .spine.target {
  outline: 2.5px solid #F2A8BD;
  outline-offset: 0px;
  z-index: 3;
}
.sp-ctrl { margin-bottom: 18px; }
.sp-ctrl-lbl {
  display: flex;
  justify-content: space-between;
  font-family: ui-monospace, Menlo, monospace;
  font-size: 13px;
  color: #5A454B;
  margin-bottom: 8px;
}
.sp-range {
  width: 100%;
  accent-color: #C95B82;
  cursor: pointer;
  height: 6px;
}
.sp-dlg-btns {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 22px;
}
.sp-btn-reset {
  border-radius: 999px;
  padding: 12px 16px;
  border: 1.5px solid #2B171D;
  background: transparent;
  color: #2B171D;
  font-weight: 700;
  cursor: pointer;
}
.sp-btn-done {
  border-radius: 999px;
  padding: 12px 16px;
  border: 0;
  background: #F2A8BD;
  color: #2B171D;
  font-weight: 700;
  cursor: pointer;
}

/* Account & Instellingen Dialog */
dialog.acc-dlg {
  width: min(860px, 95vw);
  max-height: 90vh;
  padding: 0;
  border-radius: 22px;
  background: #48051E;
  color: #FFF8F0;
  overflow: hidden;
  box-shadow: 0 28px 70px rgba(0,0,0,0.6);
}
:root[data-theme="forest"] dialog.acc-dlg { background: #18241A; }
:root[data-theme="night"] dialog.acc-dlg { background: #141A2C; }
dialog.acc-dlg::backdrop { background: rgba(12, 4, 8, 0.72); backdrop-filter: blur(4px); }

.acc-shell {
  display: flex;
  flex-direction: column;
  max-height: 90vh;
}
.acc-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 22px 12px;
}
.acc-head h2 {
  margin: 0;
  font-size: 21px;
  font-weight: 800;
  letter-spacing: -0.3px;
  color: #FFF8EE;
  flex: 1;
  text-align: center;
  padding-left: 34px;
}
.acc-x {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  border: 0;
  background: rgba(255,255,255,0.1);
  color: #fff;
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.acc-x:hover { background: rgba(255,255,255,0.2); }

.acc-grid {
  display: grid;
  grid-template-columns: 205px 1fr;
  gap: 16px;
  padding: 4px 18px 18px;
  overflow: hidden;
  flex: 1;
  min-height: 0;
}
@media(max-width: 720px) {
  .acc-grid { grid-template-columns: 1fr; gap: 10px; overflow-y: auto; }
  .acc-nav { flex-direction: row !important; overflow-x: auto; padding-bottom: 4px; }
  .acc-nav button { white-space: nowrap; flex: none; }
}

.acc-nav {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding-top: 6px;
}
.acc-nav button {
  display: flex;
  align-items: center;
  gap: 11px;
  width: 100%;
  border: 0;
  background: transparent;
  color: rgba(255,248,238,0.85);
  padding: 10px 14px;
  border-radius: 12px;
  cursor: pointer;
  font-size: 15px;
  font-weight: 600;
  text-align: left;
  transition: background .15s, color .15s;
}
.acc-nav button:hover { background: rgba(255,255,255,0.08); color: #fff; }
.acc-nav button.on { background: rgba(255,255,255,0.16); color: #fff; }
.acc-nav svg {
  width: 18px; height: 18px; stroke: currentColor; fill: none;
  stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none;
}

.acc-card {
  background: #FFF8EE;
  color: #2B171D;
  border-radius: 18px;
  padding: 22px 24px;
  overflow-y: auto;
  max-height: calc(90vh - 84px);
}
.acc-card h3 {
  margin: 0 0 14px;
  font-size: 20px;
  font-weight: 800;
  color: #2B171D;
}
.acc-sec-title {
  margin: 18px 0 8px;
  font-size: 15px;
  font-weight: 800;
  color: #2B171D;
}

function getSupaConfig() {
  if (DEFAULT_SUPABASE_URL && DEFAULT_SUPABASE_ANON_KEY) {
    return { url: DEFAULT_SUPABASE_URL.trim(), key: DEFAULT_SUPABASE_ANON_KEY.trim(), fromCode: true };
  }
  try {
    const raw = localStorage.getItem("leeshoek_supa_cfg");
    if (raw) {
      const p = JSON.parse(raw);
      if (p.url && p.key) return { url: p.url.trim(), key: p.key.trim(), fromCode: false };
    }
  } catch(e) {}
  return { url: "", key: "", fromCode: false };
}

function saveSupaConfig(url, key) {
  try {
    localStorage.setItem("leeshoek_supa_cfg", JSON.stringify({ url: url.trim(), key: key.trim() }));
  } catch(e) {}
}

function initSupabase() {
  const cfg = getSupaConfig();
  if (!cfg.url || !cfg.key || !window.supabase) {
    sb = null;
    return false;
  }
  try {
    sb = window.supabase.createClient(cfg.url, cfg.key);
    return true;
  } catch(e) {
    sb = null;
    return false;
  }
}

function scheduleCloudSync() {
  syncStatus = "syncing";
  renderTopBar();
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => pushToCloud(), 650);
}

async function pushToCloud(showToast = false) {
  if (!sb || !currentUser || !cloudProfile) return false;
  syncStatus = "syncing";
  renderTopBar();
  const nowIso = new Date().toISOString();
  try {
    const { error } = await sb.from("leeshoek_profiles").upsert({
      id: currentUser.id,
      name: cloudProfile.name || "",
      handle: cloudProfile.handle || "",
      avatar: cloudProfile.avatar || "",
      badge: cloudProfile.badge || "BOEKENWURM",
      member_since: cloudProfile.memberSince || iso(new Date()),
      prefs: cloudProfile.prefs || DEF_PREFS(),
      data: S,
      updated_at: nowIso
    });
    if (error) throw error;
    lastCloudUpdatedAt = nowIso;
    syncStatus = "synced";
    renderTopBar();
    if (showToast) toast("Gesynchroniseerd met Supabase");
    return true;
  } catch(err) {
    console.error("Supabase sync fout:", err);
    syncStatus = "error";
    renderTopBar();
    if (showToast) toast("Synchronisatie mislukt: " + (err.message || "controleer je verbinding"));
    return false;
  }
}

async function loadCloudProfile(user, opts = {}) {
  if (!sb || !user) return;
  currentUser = user;
  loadLocalState();
  syncStatus = "syncing";
  renderTopBar();

  try {
    const { data: row, error } = await sb
      .from("leeshoek_profiles")
      .select("*")
      .eq("id", user.id)
      .maybeSingle();

    if (error) throw error;

    if (row) {
      if (opts.onlyIfNewer && lastCloudUpdatedAt && row.updated_at && row.updated_at <= lastCloudUpdatedAt) {
        syncStatus = "synced";
        renderTopBar();
        return;
      }
      cloudProfile = {
        id: user.id,
        email: user.email,
        name: row.name || user.user_metadata?.name || user.email.split("@")[0],
        handle: row.handle || user.user_metadata?.handle || user.email.split("@")[0].toLowerCase(),
        avatar: row.avatar || "",
        badge: row.badge || "BOEKENWURM",
        memberSince: row.member_since || (user.created_at ? user.created_at.slice(0, 10) : iso(new Date())),
        prefs: Object.assign(DEF_PREFS(), row.prefs || {})
      };
      S = Object.assign({books:[],days:[],goal:24,notes:[],sess:[]}, row.data || {});
      lastCloudUpdatedAt = row.updated_at || new Date().toISOString();
      saveLocalOnly();
    } else {
      let initialData = {books:[],days:[],goal:24,notes:[],sess:[]};
      const wantImport = opts.importGuest || localStorage.getItem("leeshoek_pending_import") === "1";
      if (wantImport) {
        try {
          const raw = localStorage.getItem("leeshoek");
          if (raw) initialData = Object.assign(initialData, JSON.parse(raw));
        } catch(e) {}
        try { localStorage.removeItem("leeshoek_pending_import"); } catch(e) {}
      }
      cloudProfile = {
        id: user.id,
        email: user.email,
        name: user.user_metadata?.name || user.email.split("@")[0],
        handle: (user.user_metadata?.handle || user.email.split("@")[0]).toLowerCase().replace(/[^a-z0-9_.-]/g, ""),
        avatar: "",
        badge: "BOEKENWURM",
        memberSince: user.created_at ? user.created_at.slice(0, 10) : iso(new Date()),
        prefs: Object.assign(DEF_PREFS(), guestPrefs)
      };
      S = initialData;
      saveLocalOnly();
      await pushToCloud(false);
    }

    mode = getPrefs().defaultMode || "spines";
    applyTheme(getPrefs().theme);
    syncStatus = "synced";
    render();
    if (opts.welcome) toast(`Welkom terug, ${firstName(cloudProfile.name)}!`);
  } catch(err) {
    console.error("Fout bij laden profiel:", err);
    syncStatus = "error";
    renderTopBar();
    toast("Kon cloudgegevens niet laden. Controleer of de SQL-tabel is aangemaakt.");
  }
}

function applyTheme(theme) {
  const t = theme || "classic";
  if (t === "classic") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.content = t === "forest" ? "#243326" : t === "night" ? "#121726" : "#68002C";
}

let toastTimer;
function toast(msg) {
  const el = $("#toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 3000);
}

/* ========== HULPFUNCTIES BOEKENKAST ========== */
const col = b => {
  let h = 0; const s = b.id || "";
  for(let i=0; i<s.length; i++) h = s.charCodeAt(i) + ((h << 5) - h);
  return `hsl(${Math.abs(h) % 360}, 65%, 35%)`; 
};

const autoH = b => {
  if (b.pages) return Math.min(185, Math.max(120, Math.round(100 + (b.pages / 4))));
  let h = 0; const s = b.id || "";
  for(let i=0; i<s.length; i++) h = s.charCodeAt(i) + ((h << 5) - h);
  return 130 + (Math.abs(h) % 55); 
};
const autoW = b => {
  if (b.pages) return Math.min(54, Math.max(24, Math.round(18 + (b.pages / 18))));
  let h = 0; const s = b.id || "";
  for(let i=0; i<s.length; i++) h = s.charCodeAt(i) + ((h << 3) - h);
  return 28 + (Math.abs(h) % 16);
};
const sh = b => b.customH ? +b.customH : autoH(b);
const sw = b => b.customW ? +b.customW : autoW(b);

const yr=()=>new Date().getFullYear(),pg=b=>+b.pages||0,p2=n=>String(n).padStart(2,"0"),stars=n=>"★".repeat(+n||0);
const bg=b=>b.coverImg?`url('${b.coverImg}') center/cover`:col(b);
const cvh=b=>b.coverImg?"":esc(b.title);
const doneBooks=y=>S.books.filter(b=>b.status==="uit"&&b.finished&&(!y||b.finished.startsWith(y)));
const pgOn=d=>S.sess.filter(s=>s.date===d).reduce((a,s)=>a+ +s.pages,0);
const allDays=()=>new Set([...S.days,...S.sess.map(s=>s.date)]);
const tile=x=>`<button class="cv" data-edit="${x.id}" style="border:0;cursor:pointer;text-align:left;background:${bg(x)}">${cvh(x)}</button>`;

function streak(){
  const maxFree = Number(getPrefs().freeDays ?? 2);
  const set=allDays();let d=new Date(),n=0,fr=0;
  if(!set.has(iso(d)))d.setDate(d.getDate()-1);
  for(let i=0;i<400;i++){const k=iso(d);
    if(set.has(k))n++;else if(fr<maxFree&&n>0)fr++;else break;
    d.setDate(d.getDate()-1)}
  return{n,fr,maxFree}
}

          <option value="buddies"${prefs.privacy === "buddies" ? " selected" : ""}>Alleen mijn leesbuddies</option>

function syncDraftFromDom() {
  const prefs = draftAcc ? draftAcc.prefs : guestPrefs;
  if (draftAcc) {
    if ($("#acc-name")) draftAcc.name = $("#acc-name").value.trim() || draftAcc.name;
    if ($("#acc-handle")) draftAcc.handle = $("#acc-handle").value.trim().replace(/^@+/, "") || draftAcc.handle;
    if ($("#acc-badge-sel")) draftAcc.badge = $("#acc-badge-sel").value;
  }
  if ($("#acc-def-mode")) prefs.defaultMode = $("#acc-def-mode").value;
  if ($("#acc-def-fmt")) prefs.defaultFormat = $("#acc-def-fmt").value;
  if ($("#acc-rem-day")) prefs.reminderDay = $("#acc-rem-day").value;
  if ($("#acc-daily-pg")) prefs.dailyPages = Math.max(1, +$("#acc-daily-pg").value || 30);
  if ($("#acc-free-days")) prefs.freeDays = Math.max(0, +$("#acc-free-days").value || 0);
  if ($("#acc-goal-num")) draftGoal = Math.max(1, +$("#acc-goal-num").value || 24);
  if ($("#acc-priv-sel")) prefs.privacy = $("#acc-priv-sel").value;
  if ($("#acc-show-streak")) prefs.showStreak = $("#acc-show-streak").checked;
}

function bindAccountModal() {
  const on = (s, e, fn) => { const el = $(s); if (el) el.addEventListener(e, fn); };

  on("#acc-x", "click", () => closeAccountModal(true));
  on("#acc-cancel-btn", "click", () => closeAccountModal(true));

  document.querySelectorAll("[data-acc-tab]").forEach(btn => {
    btn.onclick = () => {
      syncDraftFromDom();
      accTab = btn.dataset.accTab;
      authErr = ""; authOk = "";
      renderAccountModal();
    };
  });

  document.querySelectorAll("[data-auth-mode]").forEach(btn => {
    btn.onclick = () => {
      authMode = btn.dataset.authMode;
      authErr = ""; authOk = "";
      renderAccountModal();
    };
  });

  const supaForm = $("#supa-cfg-form");
  if (supaForm) {
    supaForm.onsubmit = async e => {
      e.preventDefault();
      const d = Object.fromEntries(new FormData(supaForm));
      saveSupaConfig(d.url, d.key);
      if (!initSupabase()) {
        authErr = "Kon geen verbinding maken. Controleer je URL en Anon Key.";
        renderAccountModal();
        return;
      }
      authErr = "";
      const { data } = await sb.auth.getSession();
      if (data?.session?.user) {
        await loadCloudProfile(data.session.user);
        draftAcc = JSON.parse(JSON.stringify(cloudProfile));
      }
      renderAccountModal();
      toast("Supabase verbonden!");
    };
  }

  on("#btn-save-supa", "click", async () => {
    const u = ($("#acc-cloud-url")?.value || "").trim();
    const k = ($("#acc-cloud-key")?.value || "").trim();
    if (!u || !k) { toast("Vul zowel je Project URL als je Key in."); return; }
    saveSupaConfig(u, k);
    if (initSupabase()) {
      const { data } = await sb.auth.getSession();
      if (data?.session?.user) await loadCloudProfile(data.session.user);
      toast("Supabase-verbinding opgeslagen!");
      renderAccountModal();
    } else {
      toast("Kon Supabase niet initialiseren.");
    }
  });

  const authForm = $("#auth-form");
  if (authForm) {
    authForm.onsubmit = async e => {
      e.preventDefault();
      if (!sb || authBusy) return;
      const d = Object.fromEntries(new FormData(authForm));
      authErr = ""; authOk = ""; authBusy = true;
      renderAccountModal();

      try {
        if (authMode === "login") {
          const { data, error } = await sb.auth.signInWithPassword({
            email: (d.email || "").trim(),
            password: d.pw || ""
          });
          if (error) throw error;
          authBusy = false;
          closeAccountModal(false);
          await loadCloudProfile(data.user, { welcome: true });
        } else {
          if (d.pw !== d.pw2) throw new Error("De wachtwoorden komen niet overeen.");
          const name = (d.name || "").trim();
          const handle = (d.handle || "").trim().replace(/^@+/, "").toLowerCase();
          if (d.importGuest) {
            try { localStorage.setItem("leeshoek_pending_import", "1"); } catch(err) {}
          }
          const { data, error } = await sb.auth.signUp({
            email: (d.email || "").trim(),
            password: d.pw,
            options: { data: { name, handle } }
          });
          if (error) throw error;
          authBusy = false;
          if (data.session && data.user) {
            closeAccountModal(false);
            await loadCloudProfile(data.user, { importGuest: Boolean(d.importGuest) });
            toast(`Account aangemaakt! Welkom, ${firstName(name)}.`);
          } else {
            authMode = "login";
            authOk = "Account aangemaakt! Bevestig eerst je e-mailadres via de link in je inbox en log daarna in.";
            renderAccountModal();
          }
        }
      } catch(err) {
        authBusy = false;
        const msg = err.message || "Er ging iets mis.";
        if (msg.includes("Invalid login credentials")) authErr = "Onjuist e-mailadres of wachtwoord.";
        else if (msg.includes("Email not confirmed")) authErr = "Je e-mailadres is nog niet bevestigd. Check je inbox (of spammap).";
        else if (msg.includes("User already registered")) authErr = "Dit e-mailadres heeft al een account. Probeer in te loggen.";
        else authErr = msg;
        renderAccountModal();
      }
    };
  }

  on("#acc-av-file", "change", e => {
    const f = e.target.files[0];
    if (!f || !draftAcc) return;
    const im = new Image();
    im.onload = () => {
      const sz = Math.min(im.width, im.height);
      const sx = (im.width - sz) / 2, sy = (im.height - sz) / 2;
      const c = document.createElement("canvas");
      c.width = 160; c.height = 160;
      c.getContext("2d").drawImage(im, sx, sy, sz, sz, 0, 0, 160, 160);
      syncDraftFromDom();
      draftAcc.avatar = c.toDataURL("image/jpeg", 0.78);
      renderAccountModal();
    };
    im.src = URL.createObjectURL(f);
  });

  on("#acc-pw-tog", "click", () => {
    syncDraftFromDom();
    showPwBox = !showPwBox;
    renderAccountModal();
  });
  on("#acc-pw-save", "click", async () => {
    const p1 = ($("#acc-new-pw")?.value || "");
    const p2v = ($("#acc-new-pw2")?.value || "");
    if (p1.length < 6) { toast("Wachtwoord moet minimaal 6 tekens zijn."); return; }
    if (p1 !== p2v) { toast("Wachtwoorden komen niet overeen."); return; }
    if (!sb) return;
    const { error } = await sb.auth.updateUser({ password: p1 });
    if (error) { toast("Wachtwoord wijzigen mislukt: " + error.message); return; }
    showPwBox = false;
    renderAccountModal();
    toast("Wachtwoord bijgewerkt!");
  });

  const toggleRem = () => {
    syncDraftFromDom();
    const prefs = draftAcc ? draftAcc.prefs : guestPrefs;
    prefs.weeklyReminder = !prefs.weeklyReminder;
    renderAccountModal();
  };
  on("#acc-rem-btn", "click", toggleRem);
  on("#acc-rem-chk", "change", toggleRem);

  document.querySelectorAll("[data-pick-theme]").forEach(btn => {
    btn.onclick = () => {
      syncDraftFromDom();
      const prefs = draftAcc ? draftAcc.prefs : guestPrefs;
      prefs.theme = btn.dataset.pickTheme;
      applyTheme(prefs.theme);
      renderAccountModal();
    };
  });

  on("#acc-goal-rng", "input", e => {
    draftGoal = +e.target.value;
    if ($("#acc-goal-num")) $("#acc-goal-num").value = draftGoal;
  });
  on("#acc-goal-num", "input", e => {
    draftGoal = Math.max(1, +e.target.value || 1);
    if ($("#acc-goal-rng")) $("#acc-goal-rng").value = Math.min(200, draftGoal);
  });

  on("#acc-save-btn", "click", async () => {
    syncDraftFromDom();
    if (draftAcc) cloudProfile = draftAcc;
    S.goal = draftGoal;
    mode = getPrefs().defaultMode || mode;
    applyTheme(getPrefs().theme);
    saveLocalOnly();
    closeAccountModal(false);
    render();
    if (sb && currentUser && cloudProfile) {
      await pushToCloud(false);
      toast("Wijzigingen opgeslagen in de cloud");
    } else {
      toast("Wijzigingen opgeslagen");
    }
  });

  on("#acc-logout-btn", "click", async () => {
    if (sb) await sb.auth.signOut();
    currentUser = null;
    cloudProfile = null;
    lastCloudUpdatedAt = null;
    syncStatus = "offline";
    loadLocalState();
    spot = null;
    applyTheme(getPrefs().theme);
    closeAccountModal(false);
    render();
    toast("Je bent uitgelogd");
  });

  on("#btn-del-acc", "click", async () => {
    if (!sb || !currentUser) return;
    if (!confirm("Weet je zeker dat je al je boeken, notities en profielgegevens uit Supabase wilt wissen?")) return;
    try {
      await sb.from("leeshoek_profiles").delete().eq("id", currentUser.id);
      try { localStorage.removeItem(dataKey()); } catch(e) {}
      await sb.auth.signOut();
      currentUser = null;
      cloudProfile = null;
      lastCloudUpdatedAt = null;
      syncStatus = "offline";
      loadLocalState();
      spot = null;
      applyTheme(getPrefs().theme);
      closeAccountModal(false);
      render();
      toast("Cloudgegevens gewist en uitgelogd");
    } catch(err) {
      toast("Wissen mislukt: " + err.message);
    }
  });

  on("#btn-sync-now", "click", () => pushToCloud(true));
  on("#btn-pull-now", "click", async () => {
    if (!currentUser) return;
    await loadCloudProfile(currentUser);
    draftAcc = cloudProfile ? JSON.parse(JSON.stringify(cloudProfile)) : null;
    renderAccountModal();
    toast("Laatste versie opgehaald uit Supabase");
  });

  on("#btn-json-exp", "click", () => {
    syncDraftFromDom();
    const payload = {
      version: 2,
      exportedAt: new Date().toISOString(),
      account: draftAcc || null,
      data: S
    };
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" }));
    a.download = `leeshoek-backup-${iso(new Date())}.json`;
    a.click();
    toast("Back-up gedownload");
  });

  on("#btn-json-imp", "change", e => {
    const f = e.target.files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = async () => {
      try {
        const p = JSON.parse(rd.result);
        const d = p.data || p;
        if (!Array.isArray(d.books)) throw new Error("Ongeldig bestand");
        S = Object.assign({books:[],days:[],goal:24,notes:[],sess:[]}, d);
        if (p.account && draftAcc) {
          if (p.account.prefs) draftAcc.prefs = Object.assign(DEF_PREFS(), p.account.prefs);
          if (p.account.avatar) draftAcc.avatar = p.account.avatar;
          if (p.account.badge) draftAcc.badge = p.account.badge;
          cloudProfile = draftAcc;
        }
        save();
        applyTheme(getPrefs().theme);
        renderAccountModal();
        render();
        toast(`Back-up hersteld (${S.books.length} boeken)`);
      } catch(err) {
        toast("Kon back-up niet lezen. Kies een geldig .json bestand.");
      }
    };
    rd.readAsText(f);
  });

  on("#btn-csv-exp-acc", "click", exportCsv);
  on("#btn-csv-imp-acc", "change", e => { importCsv(e); setTimeout(() => renderAccountModal(), 250); });
}

$("#acc-dlg").addEventListener("click", e => {
  if (e.target === $("#acc-dlg")) closeAccountModal(true);
});
$("#acc-dlg").addEventListener("cancel", () => applyTheme(getPrefs().theme || "classic"));

/* ========== PLANKEN & SPOTLIGHT ========== */
function renderSpine(b, isSpot, extraClass="") {
  const isPreview = extraClass.includes("preview-only");
  const cls = `spine${b.spineImg ? " img" : ""}${isSpot ? " selected" : ""}${extraClass ? " " + extraClass : ""}`;
  const style = `height:${sh(b)}px;width:${sw(b)}px;${b.spineImg ? `background-image:url('${b.spineImg}')` : `background:${col(b)}`}`;
  const attrs = isPreview ? "" : `role="button" tabindex="0" draggable="true" data-spot="${b.id}" data-drag-id="${b.id}" data-book-status="${b.status}"`;
  if (b.spineImg) {
    return `<div class="${cls}" ${attrs} title="${esc(b.title)}" style="${style}">${esc(b.title)}</div>`;
  }
  return `<div class="${cls}" ${attrs} title="${esc(b.title)}" style="${style}"><span class="sp-title">${esc(b.title)}</span>${b.author?`<span class="sp-author">${esc(b.author)}</span>`:''}</div>`;
}

function renderFlat(b, isSpot) {
  const cls = `flat-book${b.spineImg ? " img" : ""}${isSpot ? " selected" : ""}`;
  const w = Math.min(180, Math.max(115, sh(b)));
  const h = Math.min(46, Math.max(22, Math.round(sw(b) * 0.85)));
  const style = `width:${w}px;height:${h}px;${b.spineImg ? `background-image:url('${b.spineImg}')` : `background:${col(b)}`}`;
  return `<div class="${cls}" role="button" tabindex="0" draggable="true" data-spot="${b.id}" data-drag-id="${b.id}" data-book-status="${b.status}" data-orient="vertical" title="${esc(b.title)}" style="${style}"><span class="fb-title">${esc(b.title)}</span>${b.author?`<span class="fb-author">${esc(b.author)}</span>`:''}</div>`;
}

function renderFace(b, isSpot) {
  const cls = `cover${isSpot ? " selected" : ""}`;
  const h = Math.min(185, Math.max(135, sh(b)));
  const w = Math.round(h * 0.66);
  const style = `width:${w}px;height:${h}px;background:${b.coverImg ? `url('${b.coverImg}') center/cover` : col(b)}`;
  return `<div class="${cls}" role="button" tabindex="0" draggable="true" data-spot="${b.id}" data-drag-id="${b.id}" data-book-status="${b.status}" title="${esc(b.title)}" style="${style}">${b.coverImg ? "" : `<span>${esc(b.title)}</span><small>${esc(b.author)}</small>`}</div>`;
}

function renderShelfItems(bs) {
  let out = "", i = 0;
  while (i < bs.length) {
    const b = bs[i];
    if (mode === "spines" && b.display === "flat") {
      let stack = "";
      while (i < bs.length && bs[i].display === "flat") {
        stack += renderFlat(bs[i], bs[i].id === spot);
        i++;
      }
      out += `<div class="flat-stack">${stack}</div>`;
    } else if (mode === "covers" || b.display === "face") {
      out += renderFace(b, b.id === spot);
      i++;
    } else {
      out += renderSpine(b, b.id === spot);
      i++;
    }
  }
  return out;
}

function renderSpotlight(b) {
  const r = Math.min(5, Math.max(0, +b.rating || 0));
  const starHtml = `<span>${"★".repeat(r)}</span>${"★".repeat(5 - r)}`;
  const isFace = b.display === "face";
  const isFlat = b.display === "flat";
  return `<aside class="spotlight-panel">
    <button class="spot-close" id="spot-close" aria-label="Sluit spotlight">✕</button>

function openSpineSize(id) {
  const b = S.books.find(x => x.id === id);
  if (!b) return;
  const sameShelf = S.books.filter(x => x.status === b.status);
  const idx = sameShelf.findIndex(x => x.id === b.id);
  const start = Math.max(0, idx - 3);
  const neighbors = sameShelf.slice(start, start + 7);

  let curH = sh(b);
  let curW = sw(b);

  const renderPreview = () => {
    const html = neighbors.map(nb => {
      if (nb.id === b.id) {
        const tmp = { ...nb, customH: curH, customW: curW };
        return renderSpine(tmp, false, "target preview-only");
      }
      return renderSpine(nb, false, "preview-only");
    }).join("");
    $("#sp-prev-box").innerHTML = html;
  };

  $("#dlg").className = "spine-dlg";
  $("#f").innerHTML = `
    <div class="sp-dlg-top">
      <p class="sp-dlg-kicker">spine size · ${esc(b.title).toLowerCase()}</p>
      <button type="button" class="sp-dlg-close" id="sp-x" aria-label="Sluiten">✕</button>
    </div>
    <div class="sp-preview" id="sp-prev-box"></div>
    <div class="sp-ctrl">
      <div class="sp-ctrl-lbl"><span>height</span><span id="sp-h-val">${curH}px</span></div>
      <input type="range" class="sp-range" id="sp-h" min="110" max="200" value="${curH}">
    </div>
    <div class="sp-ctrl">
      <div class="sp-ctrl-lbl"><span>thickness</span><span id="sp-w-val">${curW}px</span></div>
      <input type="range" class="sp-range" id="sp-w" min="20" max="68" value="${curW}">
    </div>
    <div class="sp-dlg-btns">
      <button type="button" class="sp-btn-reset" id="sp-reset">reset to automatic</button>
      <button type="submit" class="sp-btn-done" value="done">done</button>
    </div>
  `;

  renderPreview();

  $("#sp-h").oninput = e => {
    curH = +e.target.value;
    $("#sp-h-val").textContent = curH + "px";
    renderPreview();
  };
  $("#sp-w").oninput = e => {
    curW = +e.target.value;
    $("#sp-w-val").textContent = curW + "px";
    renderPreview();
  };
  $("#sp-reset").onclick = () => {
    delete b.customH;
    delete b.customW;
    curH = autoH(b);
    curW = autoW(b);
    $("#sp-h").value = curH;
    $("#sp-w").value = curW;
    $("#sp-h-val").textContent = curH + "px";
    $("#sp-w-val").textContent = curW + "px";
    renderPreview();
  };
  $("#sp-x").onclick = () => $("#dlg").close();
  $("#f").onsubmit = e => {
    e.preventDefault();
    b.customH = curH;
    b.customW = curW;
    save();
    $("#dlg").close();
    render();
  };
  $("#dlg").showModal();
}

/* ========== DRAG & DROP LOGICA ========== */
function clearDropMarks() {
  document.querySelectorAll(".drop-before,.drop-after,.drop-top,.drop-bottom,.drop-over")
    .forEach(el => el.classList.remove("drop-before","drop-after","drop-top","drop-bottom","drop-over"));
}

function moveBook(fromId, targetId, after, newStatus) {
  if (!fromId || fromId === targetId) return;

  if (view === "library" && sort !== "added" && targetId) {
    const domIds = [...document.querySelectorAll('.lgrid [data-drag-id]')].map(el => el.dataset.dragId);
    const idSet = new Set(domIds);
    const byId = new Map(S.books.map(b => [b.id, b]));
    let di = 0;
    S.books = S.books.map(b => idSet.has(b.id) ? byId.get(domIds[di++]) : b);
    sort = "added";
  }

  const fromIdx = S.books.findIndex(x => x.id === fromId);
  if (fromIdx < 0) return;
  const [book] = S.books.splice(fromIdx, 1);

  if (newStatus && book.status !== newStatus) {
    book.status = newStatus;
    if (newStatus === "uit" && !book.finished) book.finished = iso(new Date());
  }

  if (targetId) {
    const toIdx = S.books.findIndex(x => x.id === targetId);
    if (toIdx >= 0) {
      S.books.splice(after ? toIdx + 1 : toIdx, 0, book);
    } else {
      S.books.push(book);
    }
  } else {
    S.books.push(book);
  }

  save();
  render();
}

function bindDragDrop() {
  const items = document.querySelectorAll("[data-drag-id]");
  items.forEach(el => {
    el.addEventListener("dragstart", e => {
      dragId = el.dataset.dragId;
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", dragId);
      requestAnimationFrame(() => {
        el.classList.add("dragging");
        document.body.classList.add("is-dragging");
      });
    });

    el.addEventListener("dragend", () => {
      dragId = null;
      el.classList.remove("dragging");
      document.body.classList.remove("is-dragging");
      clearDropMarks();
    });

    el.addEventListener("dragover", e => {
      if (!dragId || el.dataset.dragId === dragId) return;
      e.preventDefault();
      e.stopPropagation();
      e.dataTransfer.dropEffect = "move";
      clearDropMarks();

      const r = el.getBoundingClientRect();
      if (el.dataset.orient === "vertical") {
        const isUpper = e.clientY < r.top + r.height / 2;
        el.classList.add(isUpper ? "drop-top" : "drop-bottom");
      } else {
        const isRight = e.clientX > r.left + r.width / 2;
        el.classList.add(isRight ? "drop-after" : "drop-before");
      }
    });

    el.addEventListener("drop", e => {
      if (!dragId || el.dataset.dragId === dragId) return;
      e.preventDefault();
      e.stopPropagation();
      const r = el.getBoundingClientRect();
      let after;
      if (el.dataset.orient === "vertical") {
        after = e.clientY < r.top + r.height / 2;
      } else {
        after = e.clientX > r.left + r.width / 2;
      }
      const targetStatus = view === "shelves" ? el.dataset.bookStatus : null;
      const srcId = dragId;
      dragId = null;
      document.body.classList.remove("is-dragging");
      clearDropMarks();
      moveBook(srcId, el.dataset.dragId, after, targetStatus);
    });
  });

  document.querySelectorAll("[data-shelf-status]").forEach(shelf => {
    shelf.addEventListener("dragover", e => {
      if (!dragId) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      clearDropMarks();
      shelf.classList.add("drop-over");
    });

    shelf.addEventListener("dragleave", e => {
      if (!shelf.contains(e.relatedTarget)) shelf.classList.remove("drop-over");
    });

    shelf.addEventListener("drop", e => {
      if (!dragId) return;
      e.preventDefault();
      const srcId = dragId;
      const newStatus = shelf.dataset.shelfStatus;
      dragId = null;
      document.body.classList.remove("is-dragging");
      clearDropMarks();
      moveBook(srcId, null, true, newStatus);
    });
  });

  document.querySelectorAll("[data-drop-status]").forEach(btn => {
    btn.addEventListener("dragover", e => {
      if (!dragId) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      clearDropMarks();
      btn.classList.add("drop-over");
    });

    btn.addEventListener("dragleave", () => btn.classList.remove("drop-over"));

    btn.addEventListener("drop", e => {
      if (!dragId) return;
      e.preventDefault();
      const srcId = dragId;
      const newStatus = btn.dataset.dropStatus;
      dragId = null;
      document.body.classList.remove("is-dragging");
      clearDropMarks();
      moveBook(srcId, null, true, newStatus);
    });
  });
}

/* ========== GEDEELDE BOEKKAFTS & RUGGEN ========== */
const makeBookKey = (title, author) => {
  const norm = s => String(s || "")
    .toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9]+/g, " ")
    .trim();
  return `${norm(title)}__${norm(author)}`;
};

async function publishSharedCover(book) {
  if (!sb || !currentUser || !book || !book.title) return;
  const key = makeBookKey(book.title, book.author);
  if (!key || key === "__") return;

  const isCustomImg = v => typeof v === "string" && v.length > 0 && !v.includes("openlibrary.org");
  const coverUrl = isCustomImg(book.coverImg) ? book.coverImg : "";
  const spineUrl = isCustomImg(book.spineImg) ? book.spineImg : "";
  if (!coverUrl && !spineUrl) return;

  try {
    const { data: existing } = await sb
      .from("shared_book_covers")
      .select("cover_url, spine_url")
      .eq("book_key", key)
      .maybeSingle();

    const payload = {
      book_key: key,
      title: book.title.trim(),
      author: (book.author || "").trim(),
      cover_url: coverUrl || existing?.cover_url || "",
      spine_url: spineUrl || existing?.spine_url || "",
      uploaded_by: currentUser.id,
      updated_at: new Date().toISOString()
    };

    await sb.from("shared_book_covers").upsert(payload, { onConflict: "book_key" });
  } catch (err) {
    console.error("Gedeelde kaft opslaan mislukt:", err);
  }
}

async function fetchSharedCovers(title, author) {
  if (!sb || !title) return [];
  const key = makeBookKey(title, author);
  const normTitle = title.toLowerCase().trim();
  try {
    let query = sb.from("shared_book_covers").select("title, author, cover_url, spine_url");
    if (author && author.trim()) {
      query = query.eq("book_key", key);
    } else {
      query = query.ilike("title", `%${normTitle}%`);
    }
    const { data, error } = await query.limit(6);
    if (error || !data) return [];
    return data.filter(r => r.cover_url || r.spine_url);
  } catch (err) {
    return [];
  }
}

 const autoFetchCover = async () => {
   const t = $("#ftit").value.trim();
   const a = $("#faut").value.trim();
   if (t.length < 3) return;
   
   $("#cprev").innerHTML = `<small style="color:var(--mut)">Zoeken naar kaften...</small>`;

   let sharedRows = [];
   let covers = [];

   try {
     sharedRows = await fetchSharedCovers(t, a);
   } catch(e) {
     sharedRows = [];
   }
   
   try {
     const query = encodeURIComponent(t + (a ? ' ' + a : ''));
     const res = await fetch(`https://openlibrary.org/search.json?q=${query}&limit=15`);
     const data = await res.json();
     covers = (data.docs || []).filter(doc => doc.cover_i).map(doc => doc.cover_i);
   } catch(e) {
     covers = [];
   }

   const sharedCovers = sharedRows.map(r => r.cover_url).filter(Boolean);
   const openLibUrls = [...new Set(covers)].map(coverId => `https://covers.openlibrary.org/b/id/${coverId}-M.jpg`);
   const uniqueCovers = [...new Set([...sharedCovers, ...openLibUrls])].slice(0, 6);
   
   if (uniqueCovers.length > 0) {
     let html = `<small style="display:block;color:var(--acc2);margin-bottom:6px">Kies de juiste kaft:</small><div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:4px">`;

               $("#dlg-cv-img").src = url;
               $("#dlg-cv-img").style.display = 'block';
           }
       }
       
       html += `<img src="${url}" data-url="${url}" class="c-opt" style="height:90px;border-radius:4px;cursor:pointer;border:3px solid ${bColor};transition:border-color .2s;flex:none">`;
     });
     html += `</div>`;
     $("#cprev").innerHTML = html;

     document.querySelectorAll('.c-opt').forEach(img => {
       img.onclick = (e) => {
         const chosenUrl = e.target.dataset.url;
         document.querySelectorAll('.c-opt').forEach(el => el.style.borderColor = 'transparent'); 
         e.target.style.borderColor = 'var(--acc)'; 
         $("#hc").value = chosenUrl;
         const chosenRow = sharedRows.find(r => r.cover_url === chosenUrl);
         if (chosenRow && chosenRow.spine_url && $("#f").elements["spineImg"]) {

         }
         if (!isNew) {
             $("#dlg-cv-img").src = chosenUrl;
             $("#dlg-cv-img").style.display = 'block';
         }
       };
     });
   } else {
     $("#cprev").innerHTML = `<small style="color:var(--mut)">Geen kaften gevonden. Upload er zelf een.</small>`;
   }
 };

const uploadCoverToStorage = async (blob, slotName) => {
  if (!sb || !currentUser) return null;
  const path = `${currentUser.id}/${uid()}-${slotName}.jpg`;
  const { error } = await sb.storage.from("book-covers").upload(path, blob, {
    contentType: "image/jpeg",
    upsert: false
  });
  if (error) throw error;
  const { data } = sb.storage.from("book-covers").getPublicUrl(path);
  return data?.publicUrl || null;
};

const K=["title","author","series","num","status","format","pages","rating","finished","price","notes"];
function exportCsv(){const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
 const t=[K.join(",")].concat(S.books.map(b=>K.map(k=>q(b[k])).join(","))).join("\n");
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/csv"}));a.download="leeshoek.csv";a.click()}
function parse(t){const r=[];let row=[],c="",q=false;for(let i=0;i<t.length;i++){const ch=t[i];
 if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
 else if(ch=='"')q=true;else if(ch==","){row.push(c);c=""}else if(ch=="\n"){row.push(c);r.push(row);row=[];c=""}else if(ch!="\r")c+=ch}
 if(c||row.length){row.push(c);r.push(row)}return r}
function importCsv(e){const f=e.target.files[0];if(!f)return;const rd=new FileReader();
 rd.onload=()=>{const [h,...rows]=parse(rd.result);const idx=h.map(x=>x.trim().toLowerCase());
  rows.filter(r=>r[0]).forEach(r=>{const o={id:uid(),status:"wil",format:"Paperback"};idx.forEach((k,i)=>{if(K.includes(k)&&r[i]!=="")o[k]=r[i]});if(o.title)S.books.push(o)});
  save();render()};rd.readAsText(f)}

/* ========== OPSTARTEN & AUTOMATISCH VERBONDEN BLIJVEN ========== */
(async function boot() {
  if (initSupabase()) {
    const { data } = await sb.auth.getSession();
    if (data?.session?.user) {
      await loadCloudProfile(data.session.user);
    }
    sb.auth.onAuthStateChange((event, session) => {
      if (event === "SIGNED_OUT") {
        currentUser = null;
        cloudProfile = null;
        lastCloudUpdatedAt = null;
        syncStatus = "offline";
        loadLocalState();
        applyTheme(getPrefs().theme);
        render();
      }
    });
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && currentUser && syncStatus !== "syncing") {
        loadCloudProfile(currentUser, { onlyIfNewer: true });
      }
    });
  }
})();
